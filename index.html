<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAMMS GROUPS AI // Live Neural Voice Orb</title>
  <meta name="theme-color" content="#03060D">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at center, #0B1528 0%, #03060D 100%);
      color: #F8FAFC;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px 34px;
    }

    /* Minimal Top Brand Header */
    .top-brand {
      text-align: center;
      z-index: 10;
    }

    .top-brand h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #38BDF8;
      text-transform: uppercase;
    }

    .state-badge {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94A3B8;
      text-transform: uppercase;
    }

    /* Center Living Holographic Voice Orb */
    .orb-stage {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .pulse-ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.35);
      transition: transform 0.15s ease, border-color 0.2s ease;
      pointer-events: none;
    }

    .pulse-ring.outer {
      width: 225px;
      height: 225px;
      border: 1px dashed rgba(56, 189, 248, 0.22);
      animation: spinSlow 18s linear infinite;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .ai-core {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #7DD3FC, #0284C7 55%, #1E1B4B 100%);
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.55), inset 0 0 24px rgba(255, 255, 255, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    /* Dynamic Voice Wave Bars inside the Orb */
    .wave-bar {
      width: 5px;
      height: 16px;
      background: #FFFFFF;
      border-radius: 4px;
      transition: height 0.08s ease;
    }

    /* Listening State (Emerald Green Pulse) */
    .orb-stage.listening .ai-core {
      background: radial-gradient(circle at 35% 30%, #6EE7B7, #059669 55%, #064E3B 100%);
      box-shadow: 0 0 55px rgba(16, 185, 129, 0.75), inset 0 0 24px rgba(255, 255, 255, 0.5);
      animation: listenPulse 1.1s infinite ease-in-out;
    }

    .orb-stage.listening .pulse-ring {
      border-color: rgba(16, 185, 129, 0.6);
    }

    @keyframes listenPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Thinking State (Amber Rotate) */
    .orb-stage.thinking .ai-core {
      background: radial-gradient(circle at 35% 30%, #FDE68A, #D97706 55%, #451A03 100%);
      box-shadow: 0 0 55px rgba(245, 158, 11, 0.7);
      animation: thinkSpin 1.4s infinite linear;
    }

    @keyframes thinkSpin {
      0% { transform: rotate(0deg) scale(0.96); }
      50% { transform: rotate(180deg) scale(1.04); }
      100% { transform: rotate(360deg) scale(0.96); }
    }

    /* Speaking State (Cyan/Purple High-Energy Bounce) */
    .orb-stage.speaking .ai-core {
      background: radial-gradient(circle at 35% 30%, #A5F3FC, #2563EB 55%, #312E81 100%);
      box-shadow: 0 0 65px rgba(56, 189, 248, 0.9);
    }

    /* Bottom Mic Controls */
    .controls {
      display: flex;
      gap: 14px;
      align-items: center;
      z-index: 10;
    }

    .ctrl-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #F8FAFC;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, #0284C7, #2563EB);
      border-color: #38BDF8;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.45);
    }
  </style>
</head>
<body>

  <div class="top-brand">
    <h1>RAMMS GROUPS AI</h1>
    <div class="state-badge" id="statusText">TAP ORB TO SPEAK</div>
  </div>

  <!-- Pure Voice Living Orb (No Text Chat Clutter) -->
  <div class="orb-stage" id="orbStage" onclick="startListening()">
    <div class="pulse-ring outer"></div>
    <div class="pulse-ring" id="innerRing"></div>
    <div class="ai-core" id="aiCore">
      <div class="wave-bar" id="b1"></div>
      <div class="wave-bar" id="b2"></div>
      <div class="wave-bar" id="b3"></div>
      <div class="wave-bar" id="b4"></div>
      <div class="wave-bar" id="b5"></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn primary" onclick="startListening()">🎙️ TALK</button>
    <button class="ctrl-btn" onclick="stopAllVoice()">⏹️ STOP</button>
  </div>

<script>
  const _k1 = "AQ.Ab8RN6JGvWhOAEvGdlL3dTHrf";
  const _k2 = "vk1b1oW5IOo1E_GY1bb4Al9SQ";
  const GEMINI_API_KEY = _k1 + _k2;

  const orbStage = document.getElementById('orbStage');
  const innerRing = document.getElementById('innerRing');
  const aiCore = document.getElementById('aiCore');
  const statusText = document.getElementById('statusText');
  const bars = [
    document.getElementById('b1'),
    document.getElementById('b2'),
    document.getElementById('b3'),
    document.getElementById('b4'),
    document.getElementById('b5')
  ];

  let waveTimer = null;
  let conversationHistory = [];
  let cachedVoices = [];

  function loadVoices() {
    if ('speechSynthesis' in window) {
      cachedVoices = window.speechSynthesis.getVoices();
    }
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function setOrbState(state, label) {
    orbStage.className = 'orb-stage ' + state;
    statusText.innerText = label;

    if (waveTimer) {
      clearInterval(waveTimer);
      waveTimer = null;
    }

    if (state === 'speaking' || state === 'listening') {
      waveTimer = setInterval(() => {
        const scale = state === 'speaking' ? (0.98 + Math.random() * 0.14) : (1.0 + Math.random() * 0.06);
        aiCore.style.transform = `scale(${scale})`;
        innerRing.style.transform = `scale(${scale * 1.08})`;
        bars.forEach((bar) => {
          const h = state === 'speaking'
            ? Math.floor(14 + Math.random() * 44)
            : Math.floor(12 + Math.random() * 24);
          bar.style.height = `${h}px`;
        });
      }, 95);
    } else {
      aiCore.style.transform = 'scale(1)';
      innerRing.style.transform = 'scale(1)';
      bars.forEach(bar => bar.style.height = '16px');
    }
  }

  function stopAllVoice() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    setOrbState('', 'TAP ORB TO SPEAK');
  }

  // Crystal-clear Natural Voice Selector
  function selectCrystalClearVoice(isHindiText) {
    if (!cachedVoices.length) loadVoices();
    if (isHindiText) {
      return (
        cachedVoices.find(v => v.lang.toLowerCase() === 'hi-in' && v.name.toLowerCase().includes('google')) ||
        cachedVoices.find(v => v.lang.toLowerCase().startsWith('hi')) ||
        cachedVoices.find(v => v.lang.toLowerCase().includes('en-in')) ||
        null
      );
    }
    return (
      cachedVoices.find(v => v.lang.toLowerCase() === 'en-in' && v.name.toLowerCase().includes('google')) ||
      cachedVoices.find(v => v.lang.toLowerCase().startsWith('en') && v.name.toLowerCase().includes('google')) ||
      cachedVoices.find(v => v.lang.toLowerCase().startsWith('en')) ||
      null
    );
  }

  // Split long replies into clean sentences so Chrome speech engine never stutters or cuts off
  function speakResponse(spokenText, autoReListen = true) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const clean = spokenText
      .replace(/[*#_`•\[\]()]/g, '')
      .replace(/https?:\/\/\S+/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    if (!clean) {
      setOrbState('', 'TAP ORB TO SPEAK');
      return;
    }

    const hasHindiScript = /[\u0900-\u097F]/.test(clean);
    const chosenVoice = selectCrystalClearVoice(hasHindiScript);

    // Break into natural sentence chunks for crystal clarity
    const chunks = clean.match(/[^.!?।]+[.!?।]*/g) || [clean];
    let idx = 0;

    function speakNextChunk() {
      if (idx >= chunks.length) {
        setOrbState('', 'TAP ORB TO SPEAK');
        if (autoReListen) {
          setTimeout(() => startListening(), 450);
        }
        return;
      }

      const part = chunks[idx].trim();
      idx++;
      if (!part) {
        speakNextChunk();
        return;
      }

      const utterance = new SpeechSynthesisUtterance(part);
      if (chosenVoice) {
        utterance.voice = chosenVoice;
        utterance.lang = chosenVoice.lang;
      } else {
        utterance.lang = hasHindiScript ? 'hi-IN' : 'en-IN';
      }

      utterance.rate = 1.02;  // Natural human pacing
      utterance.pitch = 1.02; // Crisp, clear vocal tone
      utterance.volume = 1.0;

      utterance.onstart = () => setOrbState('speaking', 'SPEAKING...');
      utterance.onend = () => speakNextChunk();
      utterance.onerror = () => {
        setOrbState('', 'TAP ORB TO SPEAK');
      };

      window.speechSynthesis.speak(utterance);
    }

    speakNextChunk();
  }

  // Real Gemini 2.5 Flash + Google Search Grounding
  async function queryRealAI(userSpeech) {
    const nowStr = new Date().toLocaleString('en-IN', {
      timeZone: 'Asia/Kolkata',
      dateStyle: 'full',
      timeStyle: 'short'
    });

    const tempHistory = [...conversationHistory, { role: 'user', parts: [{ text: userSpeech }] }].slice(-8);

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: {
          parts: [{
            text: `You are RAMMS GROUPS AI, an intelligent live voice assistant created by Manas Jha (CEO of RAMMS GROUPS; Founder: Rupesh Kumar Sinha) for Tata DAV School. Current India time: ${nowStr}. Always use Google Search for live news, weather, sports, and current world facts. Reply in natural, conversational spoken Hindi or English (matching the user's language) in 2 to 3 crisp sentences without bullet points, symbols, or markdown.`
          }]
        },
        contents: tempHistory,
        tools: [{ google_search: {} }]
      })
    });

    const data = await res.json();
    if (!res.ok || data.error) {
      throw new Error(data?.error?.message || 'API Error');
    }

    const answer = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (answer) {
      conversationHistory = [...tempHistory, { role: 'model', parts: [{ text: answer }] }];
      return answer;
    }
    throw new Error('Empty response');
  }

  // Live Fallback if network hiccups
  async function smartLiveFallback(q) {
    const lower = q.toLowerCase();

    if (lower.includes('time') || lower.includes('samay') || lower.includes('date') || lower.includes('tarikh')) {
      const now = new Date();
      return `Abhi samay hai ${now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true })} aur aaj ${now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })} hai.`;
    }

    if (lower.includes('weather') || lower.includes('mausam') || lower.includes('temperature')) {
      const words = q.replace(/[^a-zA-Z\s]/g, '').split(/\s+/).filter(w => w.length > 2 && !['weather','mausam','temperature','kaisa','hai','aaj','ka','ki','ke','batao','today'].includes(w.toLowerCase()));
      const city = words[0] || 'Dhanbad';
      const geo = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`)).json();
      if (geo?.results?.[0]) {
        const p = geo.results[0];
        const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,wind_speed_10m`)).json();
        return `${p.name} mein abhi taapman ${w.current.temperature_2m} degree Celsius hai aur hawa ${w.current.wind_speed_10m} kilometer prati ghanta ki raftar se chal rahi hai.`;
      }
    }

    if (lower.includes('news') || lower.includes('khabar')) {
      const rss = await (await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en')}`)).json();
      if (rss?.items?.length) {
        return `Aaj ki badi khabar hai: ${rss.items[0].title}. Dusri khabar: ${rss.items[1].title}.`;
      }
    }

    const cleanTopic = q.replace(/^(who is|what is|tell me about|kya hai|kaun hai|ke baare mein batao)\s+/i, '').trim();
    const sData = await (await fetch(`https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(cleanTopic)}&format=json&origin=*`)).json();
    if (sData?.query?.search?.[0]) {
      const title = sData.query.search[0].title;
      const sum = await (await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)).json();
      if (sum?.extract) return sum.extract.split('. ').slice(0, 2).join('. ') + '.';
    }

    return 'Main aapki baat sun raha hoon, kripya apna sawal dubara bolein.';
  }

  async function handleUserSpeech(transcript) {
    setOrbState('thinking', 'THINKING...');
    try {
      const reply = await queryRealAI(transcript);
      speakResponse(reply, true);
    } catch (err) {
      const fallbackReply = await smartLiveFallback(transcript);
      speakResponse(fallbackReply, true);
    }
  }

  function startListening() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      statusText.innerText = 'VOICE NOT SUPPORTED';
      return;
    }

    const rec = new SpeechRec();
    rec.lang = 'hi-IN';
    rec.interimResults = false;

    rec.onstart = () => setOrbState('listening', 'LISTENING...');
    rec.onresult = (event) => {
      const spoken = event.results[0][0].transcript;
      handleUserSpeech(spoken);
    };
    rec.onerror = () => setOrbState('', 'TAP ORB TO SPEAK');
    rec.onend = () => {
      if (orbStage.classList.contains('listening')) {
        setOrbState('', 'TAP ORB TO SPEAK');
      }
    };

    rec.start();
  }
</script>
</body>
</html>
