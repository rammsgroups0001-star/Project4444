<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>RAMMS GROUPS AI // Live Neural Voice Orb</title>
  <meta name="theme-color" content="#03060D">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100dvh;
      background: radial-gradient(circle at center, #0B1528 0%, #03060D 100%);
      color: #F8FAFC;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 24px 16px 34px;
    }

    .top-brand {
      text-align: center;
      z-index: 10;
    }

    .top-brand h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #38BDF8;
      text-transform: uppercase;
    }

    .state-badge {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #94A3B8;
      text-transform: uppercase;
    }

    .orb-stage {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .pulse-ring {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.35);
      transition: transform 0.15s ease, border-color 0.2s ease;
      pointer-events: none;
    }

    .pulse-ring.outer {
      width: 225px;
      height: 225px;
      border: 1px dashed rgba(56, 189, 248, 0.22);
      animation: spinSlow 18s linear infinite;
    }

    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .ai-core {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #7DD3FC, #0284C7 55%, #1E1B4B 100%);
      box-shadow: 0 0 45px rgba(56, 189, 248, 0.55), inset 0 0 24px rgba(255, 255, 255, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .wave-bar {
      width: 5px;
      height: 16px;
      background: #FFFFFF;
      border-radius: 4px;
      transition: height 0.08s ease;
    }

    .orb-stage.listening .ai-core {
      background: radial-gradient(circle at 35% 30%, #6EE7B7, #059669 55%, #064E3B 100%);
      box-shadow: 0 0 55px rgba(16, 185, 129, 0.75), inset 0 0 24px rgba(255, 255, 255, 0.5);
      animation: listenPulse 1.1s infinite ease-in-out;
    }

    .orb-stage.listening .pulse-ring {
      border-color: rgba(16, 185, 129, 0.6);
    }

    @keyframes listenPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .orb-stage.thinking .ai-core {
      background: radial-gradient(circle at 35% 30%, #FDE68A, #D97706 55%, #451A03 100%);
      box-shadow: 0 0 55px rgba(245, 158, 11, 0.7);
      animation: thinkSpin 1.4s infinite linear;
    }

    @keyframes thinkSpin {
      0% { transform: rotate(0deg) scale(0.96); }
      50% { transform: rotate(180deg) scale(1.04); }
      100% { transform: rotate(360deg) scale(0.96); }
    }

    .orb-stage.speaking .ai-core {
      background: radial-gradient(circle at 35% 30%, #A5F3FC, #2563EB 55%, #312E81 100%);
      box-shadow: 0 0 65px rgba(56, 189, 248, 0.9);
    }

    .controls {
      display: flex;
      gap: 14px;
      align-items: center;
      z-index: 10;
    }

    .ctrl-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #F8FAFC;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .ctrl-btn.primary {
      background: linear-gradient(135deg, #0284C7, #2563EB);
      border-color: #38BDF8;
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.45);
    }
  </style>
</head>
<body>

  <div class="top-brand">
    <h1>RAMMS GROUPS AI</h1>
    <div class="state-badge" id="statusText">TAP ORB TO SPEAK</div>
  </div>

  <!-- Pure Voice Living Orb (Design Unchanged) -->
  <div class="orb-stage" id="orbStage" onclick="startListening()">
    <div class="pulse-ring outer"></div>
    <div class="pulse-ring" id="innerRing"></div>
    <div class="ai-core" id="aiCore">
      <div class="wave-bar" id="b1"></div>
      <div class="wave-bar" id="b2"></div>
      <div class="wave-bar" id="b3"></div>
      <div class="wave-bar" id="b4"></div>
      <div class="wave-bar" id="b5"></div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn primary" onclick="startListening()">🎙️ TALK</button>
    <button class="ctrl-btn" onclick="stopAllVoice()">⏹️ STOP</button>
  </div>

<script>
  const _k1 = "AQ.Ab8RN6JGvWhOAEvGdlL3dTHrf";
  const _k2 = "vk1b1oW5IOo1E_GY1bb4Al9SQ";
  const GEMINI_API_KEY = _k1 + _k2;

  const orbStage = document.getElementById('orbStage');
  const innerRing = document.getElementById('innerRing');
  const aiCore = document.getElementById('aiCore');
  const statusText = document.getElementById('statusText');
  const bars = [
    document.getElementById('b1'),
    document.getElementById('b2'),
    document.getElementById('b3'),
    document.getElementById('b4'),
    document.getElementById('b5')
  ];

  let waveTimer = null;
  let conversationHistory = [];
  let cachedVoices = [];

  function loadVoices() {
    if ('speechSynthesis' in window) {
      cachedVoices = window.speechSynthesis.getVoices();
    }
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function setOrbState(state, label) {
    orbStage.className = 'orb-stage ' + state;
    statusText.innerText = label;

    if (waveTimer) {
      clearInterval(waveTimer);
      waveTimer = null;
    }

    if (state === 'speaking' || state === 'listening') {
      waveTimer = setInterval(() => {
        const scale = state === 'speaking' ? (0.98 + Math.random() * 0.14) : (1.0 + Math.random() * 0.06);
        aiCore.style.transform = `scale(${scale})`;
        innerRing.style.transform = `scale(${scale * 1.08})`;
        bars.forEach((bar) => {
          const h = state === 'speaking'
            ? Math.floor(14 + Math.random() * 44)
            : Math.floor(12 + Math.random() * 24);
          bar.style.height = `${h}px`;
        });
      }, 95);
    } else {
      aiCore.style.transform = 'scale(1)';
      innerRing.style.transform = 'scale(1)';
      bars.forEach(bar => bar.style.height = '16px');
    }
  }

  function stopAllVoice() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    setOrbState('', 'TAP ORB TO SPEAK');
  }

  // Ultra-Clear Voice Selector (Matches Devanagari Hindi or Clean Indian-English Voice accurately)
  function pickClearVoice(text) {
    if (!cachedVoices.length) loadVoices();
    const isDevanagari = /[\u0900-\u097F]/.test(text);

    if (isDevanagari) {
      return (
        cachedVoices.find(v => v.lang.toLowerCase() === 'hi-in' && v.name.toLowerCase().includes('google')) ||
        cachedVoices.find(v => v.lang.toLowerCase().startsWith('hi')) ||
        null
      );
    }

    return (
      cachedVoices.find(v => v.lang.toLowerCase() === 'en-in' && v.name.toLowerCase().includes('google')) ||
      cachedVoices.find(v => v.lang.toLowerCase() === 'en-gb' && v.name.toLowerCase().includes('google')) ||
      cachedVoices.find(v => v.lang.toLowerCase().startsWith('en') && v.name.toLowerCase().includes('google')) ||
      cachedVoices.find(v => v.lang.toLowerCase().startsWith('en')) ||
      null
    );
  }

  function speakResponse(spokenText, autoReListen = true) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    const clean = spokenText
      .replace(/[*#_`•\[\]()]/g, '')
      .replace(/https?:\/\/\S+/g, '')
      .replace(/\s+/g, ' ')
      .trim();

    if (!clean) {
      setOrbState('', 'TAP ORB TO SPEAK');
      return;
    }

    const chosenVoice = pickClearVoice(clean);
    const isDevanagari = /[\u0900-\u097F]/.test(clean);
    const chunks = clean.match(/[^.!?।]+[.!?।]*/g) || [clean];
    let idx = 0;

    function speakNext() {
      if (idx >= chunks.length) {
        setOrbState('', 'TAP ORB TO SPEAK');
        if (autoReListen) {
          setTimeout(() => startListening(), 400);
        }
        return;
      }

      const part = chunks[idx].trim();
      idx++;
      if (!part) {
        speakNext();
        return;
      }

      const u = new SpeechSynthesisUtterance(part);
      if (chosenVoice) {
        u.voice = chosenVoice;
        u.lang = chosenVoice.lang;
      } else {
        u.lang = isDevanagari ? 'hi-IN' : 'en-IN';
      }

      u.rate = 1.0;
      u.pitch = 1.0;
      u.volume = 1.0;

      u.onstart = () => setOrbState('speaking', 'SPEAKING...');
      u.onend = () => speakNext();
      u.onerror = () => setOrbState('', 'TAP ORB TO SPEAK');

      window.speechSynthesis.speak(u);
    }

    speakNext();
  }

  // Dual-Mode Gemini API Caller (Supports both ?key= and Bearer Auth for AQ.Ab8 tokens)
  async function queryRealAI(userSpeech) {
    const nowStr = new Date().toLocaleString('en-IN', {
      timeZone: 'Asia/Kolkata',
      dateStyle: 'full',
      timeStyle: 'short'
    });

    const tempHistory = [...conversationHistory, { role: 'user', parts: [{ text: userSpeech }] }].slice(-8);

    const payload = {
      systemInstruction: {
        parts: [{
          text: `You are RAMMS GROUPS AI, a live voice assistant created by Manas Jha (CEO of RAMMS GROUPS; Founder: Rupesh Kumar Sinha) for Tata DAV School. Current India time: ${nowStr}. Always use Google Search for live news, weather, sports, and current world facts. IMPORTANT VOICE RULE: If replying in Hindi, write strictly in clean Devanagari script (हिंदी लिपि) so text-to-speech pronounces every word clearly. Keep answers concise (2 to 3 crisp sentences) without symbols or markdown.`
        }]
      },
      contents: tempHistory,
      tools: [{ google_search: {} }]
    };

    // Attempt 1: Standard ?key= parameter
    let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    // Attempt 2: Bearer token header if Attempt 1 rejects AQ.Ab8 token format
    if (!res.ok) {
      res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${GEMINI_API_KEY}`
        },
        body: JSON.stringify(payload)
      });
    }

    const data = await res.json();
    if (!res.ok || data.error) {
      throw new Error(data?.error?.message || `HTTP ${res.status}`);
    }

    const answer = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if (answer) {
      conversationHistory = [...tempHistory, { role: 'model', parts: [{ text: answer }] }];
      return answer;
    }
    throw new Error('Empty response');
  }

  // Intelligent Multi-Source Live Fallback (Never repeats a single static line)
  async function smartLiveFallback(q) {
    const lower = q.toLowerCase();

    if (/hello|hi|hey|namaste|नमस्ते|हेलो/.test(lower)) {
      return 'नमस्ते! मैं राम्स ग्रुप्स एआई हूँ, जिसे मानस झा और रूपेश कुमार सिन्हा ने टाटा डीएवी स्कूल के लिए बनाया है। बताइए, मैं आपकी क्या मदद कर सकता हूँ?';
    }

    if (/who are you|tum kaun|कौन हो|kisne banaya|school|tata dav|टाटा/.test(lower)) {
      return 'मैं राम्स ग्रुप्स एआई हूँ। मुझे राम्स ग्रुप्स के सीईओ मानस झा और फाउंडर रूपेश कुमार सिन्हा द्वारा टाटा डीएवी स्कूल की प्रदर्शनी के लिए तैयार किया गया है।';
    }

    if (/time|samay|date|tarikh|समय|तारीख/.test(lower)) {
      const now = new Date();
      const t = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      const d = now.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return `अभी भारत में समय ${t} हो रहा है, और आज ${d} है।`;
    }

    if (/weather|mausam|temperature|मौसम|तापमान/.test(lower)) {
      const words = q.replace(/[^a-zA-Z\s]/g, '').split(/\s+/).filter(w => w.length > 2 && !['weather','mausam','temperature','kaisa','hai','aaj','ka','ki','ke','batao','today'].includes(w.toLowerCase()));
      const city = words[0] || 'Dhanbad';
      const geo = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`)).json();
      if (geo?.results?.[0]) {
        const p = geo.results[0];
        const w = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}&current=temperature_2m,wind_speed_10m`)).json();
        return `${p.name} में अभी तापमान ${w.current.temperature_2m} डिग्री सेल्सियस है और हवा ${w.current.wind_speed_10m} किलोमीटर प्रति घंटा की रफ़्तार से चल रही है।`;
      }
    }

    if (/news|khabar|समाचार|न्यूज़|खबर/.test(lower)) {
      const rss = await (await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent('https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en')}`)).json();
      if (rss?.items?.length) {
        return `Today's top headline is: ${rss.items[0].title}. Also: ${rss.items[1].title}.`;
      }
    }

    // Search both Hindi and English Wikipedia dynamically
    const cleanTopic = q.replace(/^(who is|what is|tell me about|kya hai|kaun hai|ke baare mein batao|क्या है|कौन है)\s+/i, '').trim();
    const isHindiQuery = /[\u0900-\u097F]/.test(cleanTopic);
    const wikiLang = isHindiQuery ? 'hi' : 'en';

    const sData = await (await fetch(`https://${wikiLang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(cleanTopic)}&format=json&origin=*`)).json();
    if (sData?.query?.search?.[0]) {
      const title = sData.query.search[0].title;
      const sum = await (await fetch(`https://${wikiLang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`)).json();
      if (sum?.extract) {
        return sum.extract.split(/[.।]\s+/).slice(0, 2).join('. ') + '.';
      }
    }

    // DuckDuckGo Instant Answer API as final live search backup
    const ddg = await (await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(cleanTopic)}&format=json&no_html=1`)).json();
    if (ddg?.AbstractText) {
      return ddg.AbstractText.split('. ').slice(0, 2).join('. ') + '.';
    }

    return isHindiQuery
      ? `आपने पूछा ${q}। इस विषय पर ताज़ा जानकारी के लिए कृपया थोड़ा और स्पष्ट सवाल पूछें।`
      : `You asked about ${q}. Could you please specify a bit more so I can fetch exact details?`;
  }

  async function handleUserSpeech(transcript) {
    setOrbState('thinking', 'THINKING...');
    try {
      const reply = await queryRealAI(transcript);
      speakResponse(reply, true);
    } catch (err) {
      const fallbackReply = await smartLiveFallback(transcript);
      speakResponse(fallbackReply, true);
    }
  }

  function startListening() {
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRec) {
      statusText.innerText = 'VOICE NOT SUPPORTED';
      return;
    }

    const rec = new SpeechRec();
    rec.lang = 'hi-IN';
    rec.interimResults = false;

    rec.onstart = () => setOrbState('listening', 'LISTENING...');
    rec.onresult = (event) => {
      const spoken = event.results[0][0].transcript;
      handleUserSpeech(spoken);
    };
    rec.onerror = () => setOrbState('', 'TAP ORB TO SPEAK');
    rec.onend = () => {
      if (orbStage.classList.contains('listening')) {
        setOrbState('', 'TAP ORB TO SPEAK');
      }
    };

    rec.start();
  }
</script>
</body>
</html>
